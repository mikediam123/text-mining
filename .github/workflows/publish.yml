# Builds the book from the SYNTHETIC sample data and publishes it to GitHub Pages.
#
# - Every push and pull request runs the build, so a chapter that stops rendering
#   (for example the topic-model chapters) is caught before it reaches the site.
# - Only pushes to main deploy.
#
# One-time setup: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Build and publish book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # setup-r-dependencies also installs the system libraries these need
          # (for example the GNU Scientific Library for topicmodels)
          packages: |
            any::tidyverse
            any::readxl
            any::tidytext
            any::reshape2
            any::topicmodels
            any::stm
            any::glmnet
            any::Matrix
            any::ggraph
            any::igraph
            any::rsample
            any::rmarkdown
            any::knitr
            any::downlit
            any::xml2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build the analysis file from the synthetic workbook
        run: Rscript R/01-prep-data.R

      - name: TEMP diagnostic (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: Rscript R/debug-lda.R

      - name: Render the book
        run: quarto render

      # Manual runs only: print the rendered text of the topic-model chapters into the
      # log so their output can be reviewed without downloading the site.
      - name: Print rendered topic-model chapters (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import re, html
          for f in ["docs/04-topic-lda.html", "docs/05-topic-stm.html"]:
              t = open(f, encoding="utf-8").read()
              m = re.search(r"<main.*?</main>", t, re.S).group(0)
              m = re.sub(r"<style.*?</style>|<script.*?</script>|<svg.*?</svg>|<img[^>]*>", "", m, flags=re.S)
              m = re.sub(r"<br ?/?>|</p>|</tr>|</pre>|</h\d>", "\n", m)
              m = html.unescape(re.sub(r"<[^>]+>", "", m))
              print("=" * 30, f, "=" * 30)
              print(re.sub(r"\n\s*\n+", "\n", m))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
